<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Public API Explorer preview</title>
  <desc id="desc">A dark and light neutral mockup of the MergeFund API Explorer page with endpoint navigation, request builder, and JSON response.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#312e81" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#f8fafc"/>
  <rect x="36" y="28" width="1368" height="172" rx="28" fill="url(#hero)" stroke="#ddd6fe"/>
  <text x="72" y="70" fill="#6d28d9" font-family="Inter,Arial" font-size="14" font-weight="700">DEVELOPER TOOLS · V1</text>
  <text x="72" y="120" fill="#0f172a" font-family="Inter,Arial" font-size="42" font-weight="800">Explore your API surface before you ship it.</text>
  <text x="72" y="158" fill="#475569" font-family="Inter,Arial" font-size="17">Compose a request, inspect a realistic response, and understand the contract at a glance.</text>
  <rect x="36" y="230" width="270" height="620" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="62" y="270" fill="#94a3b8" font-family="Inter,Arial" font-size="12" font-weight="800" letter-spacing="2">ENDPOINTS</text>
  <text x="62" y="296" fill="#64748b" font-family="Inter,Arial" font-size="14">Choose an example request.</text>
  <rect x="50" y="322" width="242" height="100" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="66" y="340" width="40" height="23" rx="6" fill="#dcfce7" stroke="#bbf7d0"/><text x="86" y="356" text-anchor="middle" fill="#047857" font-family="monospace" font-size="11" font-weight="700">GET</text>
  <text x="66" y="384" fill="#1e293b" font-family="Inter,Arial" font-size="15" font-weight="700">List bounties</text>
  <text x="66" y="405" fill="#64748b" font-family="monospace" font-size="11">/v1/bounties</text>
  <rect x="50" y="434" width="242" height="90" rx="14" fill="#fff"/><rect x="66" y="452" width="40" height="23" rx="6" fill="#dcfce7" stroke="#bbf7d0"/><text x="86" y="468" text-anchor="middle" fill="#047857" font-family="monospace" font-size="11" font-weight="700">GET</text><text x="66" y="496" fill="#1e293b" font-family="Inter,Arial" font-size="15" font-weight="700">Contributor profile</text><text x="66" y="514" fill="#64748b" font-family="monospace" font-size="11">/v1/contributors/me</text>
  <rect x="50" y="536" width="242" height="90" rx="14" fill="#fff"/><rect x="66" y="554" width="48" height="23" rx="6" fill="#ede9fe" stroke="#ddd6fe"/><text x="90" y="570" text-anchor="middle" fill="#6d28d9" font-family="monospace" font-size="11" font-weight="700">POST</text><text x="66" y="598" fill="#1e293b" font-family="Inter,Arial" font-size="15" font-weight="700">Claim a bounty</text><text x="66" y="616" fill="#64748b" font-family="monospace" font-size="11">/v1/bounties/bf_1042/claim</text>
  <rect x="330" y="230" width="1074" height="290" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <rect x="362" y="262" width="48" height="25" rx="6" fill="#dcfce7" stroke="#bbf7d0"/><text x="386" y="279" text-anchor="middle" fill="#047857" font-family="monospace" font-size="11" font-weight="700">GET</text>
  <text x="424" y="280" fill="#0f172a" font-family="Inter,Arial" font-size="22" font-weight="800">List bounties</text>
  <text x="362" y="316" fill="#64748b" font-family="Inter,Arial" font-size="14">Find funded work that matches a contributor's skills.</text>
  <text x="362" y="358" fill="#334155" font-family="Inter,Arial" font-size="13" font-weight="700">Environment</text><rect x="502" y="338" width="320" height="39" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="520" y="363" fill="#334155" font-family="Inter,Arial" font-size="14">Mock data</text>
  <text x="362" y="410" fill="#334155" font-family="Inter,Arial" font-size="13" font-weight="700">Query parameters</text><rect x="502" y="390" width="620" height="39" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="520" y="415" fill="#334155" font-family="monospace" font-size="13">status=funded&amp;limit=10</text>
  <rect x="362" y="452" width="1008" height="44" rx="10" fill="#0f172a"/><text x="382" y="480" fill="#cbd5e1" font-family="monospace" font-size="12">https://api.mergefund.dev/v1/bounties?status=funded&amp;limit=10</text><rect x="1238" y="460" width="110" height="28" rx="8" fill="#7c3aed"/><text x="1293" y="479" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="12" font-weight="700">Send request</text>
  <rect x="330" y="546" width="720" height="304" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="362" y="586" fill="#94a3b8" font-family="Inter,Arial" font-size="12" font-weight="800" letter-spacing="2">RESPONSE</text><text x="362" y="612" fill="#64748b" font-family="Inter,Arial" font-size="14">Send the request to preview data</text><rect x="884" y="574" width="130" height="32" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="949" y="595" text-anchor="middle" fill="#475569" font-family="Inter,Arial" font-size="12" font-weight="700">Copy JSON</text>
  <rect x="362" y="644" width="656" height="176" rx="10" fill="#020617"/><text x="382" y="676" fill="#86efac" font-family="monospace" font-size="13">{</text><text x="402" y="702" fill="#86efac" font-family="monospace" font-size="13">"data": [{ "id": "bf_1042",</text><text x="402" y="728" fill="#86efac" font-family="monospace" font-size="13">  "title": "Improve onboarding flow",</text><text x="402" y="754" fill="#86efac" font-family="monospace" font-size="13">  "reward": 480, "status": "funded" }]</text><text x="382" y="780" fill="#86efac" font-family="monospace" font-size="13">}</text>
  <rect x="1074" y="546" width="330" height="304" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/><text x="1106" y="586" fill="#94a3b8" font-family="Inter,Arial" font-size="12" font-weight="800" letter-spacing="2">REQUEST FIELDS</text><text x="1106" y="624" fill="#1e293b" font-family="monospace" font-size="14" font-weight="700">status</text><text x="1106" y="647" fill="#64748b" font-family="Inter,Arial" font-size="12">Filter by open, funded, or completed.</text><line x1="1106" y1="674" x2="1372" y2="674" stroke="#e2e8f0"/><text x="1106" y="708" fill="#1e293b" font-family="monospace" font-size="14" font-weight="700">limit</text><text x="1106" y="731" fill="#64748b" font-family="Inter,Arial" font-size="12">Maximum records to return.</text><line x1="1106" y1="758" x2="1372" y2="758" stroke="#e2e8f0"/><text x="1106" y="792" fill="#64748b" font-family="Inter,Arial" font-size="12">Authentication</text><text x="1106" y="816" fill="#1e293b" font-family="Inter,Arial" font-size="14" font-weight="700">Public</text>
</svg>
